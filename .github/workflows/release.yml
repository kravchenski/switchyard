name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR and tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  verify:
    name: Verify release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests and build validation
        run: bun run ci

  publish:
    name: Publish GHCR image
    needs: [release-please, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/freeqwenapi
          tags: |
            type=raw,value=${{ needs.release-please.outputs.version }}
            type=raw,value=${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}
            type=raw,value=${{ needs.release-please.outputs.major }}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

  desktop:
    name: Desktop installer (${{ matrix.target }})
    needs: [release-please, verify]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            triple: x86_64-unknown-linux-gnu
            bun-target: bun-linux-x64
            formats: deb,appimage,pacman
            arch-package: 'true'
          - os: ubuntu-24.04-arm
            target: linux-arm64
            triple: aarch64-unknown-linux-gnu
            bun-target: bun-linux-arm64
            formats: deb,appimage,pacman
            arch-package: 'false'
          - os: macos-latest
            target: macos-arm64
            triple: aarch64-apple-darwin
            bun-target: bun-darwin-arm64
            formats: dmg
            arch-package: 'false'
          - os: windows-latest
            target: windows-x64
            triple: x86_64-pc-windows-msvc
            bun-target: bun-windows-x64
            formats: nsis
            arch-package: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Package
        id: package
        uses: ./.github/actions/desktop-package
        with:
          target: ${{ matrix.target }}
          triple: ${{ matrix.triple }}
          bun-target: ${{ matrix.bun-target }}
          formats: ${{ matrix.formats }}
          arch-package: ${{ matrix.arch-package }}
          version: ${{ needs.release-please.outputs.version }}

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" ${{ steps.package.outputs.dir }}/* --clobber

  checksums:
    name: Checksums and AUR PKGBUILD
    needs: [release-please, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Write SHA256SUMS and PKGBUILD
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          mkdir release
          gh release download "$TAG" --dir release
          rm -f release/SHA256SUMS release/PKGBUILD
          bun run scripts/pkgbuild.ts --version "$VERSION" \
            --x86_64 "release/switchyard-$VERSION-linux-x64.tar.gz" \
            --aarch64 "release/switchyard-$VERSION-linux-arm64.tar.gz" \
            --out release/PKGBUILD
          (cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          gh release upload "$TAG" release/SHA256SUMS release/PKGBUILD --clobber

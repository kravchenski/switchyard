name: Desktop

on:
  push:
    branches:
      - main
    paths:
      - desktop/**
      - .github/workflows/desktop.yml
      - .github/actions/desktop-package/**
  pull_request:
    paths:
      - desktop/**
      - .github/workflows/desktop.yml
      - .github/actions/desktop-package/**

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Desktop tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux GPUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake libclang-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev \
            libfontconfig-dev libfreetype-dev libasound2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Test
        run: cargo test --manifest-path desktop/Cargo.toml --locked

  package:
    name: Desktop installer (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            triple: x86_64-unknown-linux-gnu
            bun-target: bun-linux-x64
            formats: deb,appimage,pacman
            arch-package: 'true'
          - os: ubuntu-24.04-arm
            target: linux-arm64
            triple: aarch64-unknown-linux-gnu
            bun-target: bun-linux-arm64
            formats: deb,appimage,pacman
            arch-package: 'false'
          - os: macos-latest
            target: macos-arm64
            triple: aarch64-apple-darwin
            bun-target: bun-darwin-arm64
            formats: dmg
            arch-package: 'false'
          - os: windows-latest
            target: windows-x64
            triple: x86_64-pc-windows-msvc
            bun-target: bun-windows-x64
            formats: nsis
            arch-package: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Package
        id: package
        uses: ./.github/actions/desktop-package
        with:
          target: ${{ matrix.target }}
          triple: ${{ matrix.triple }}
          bun-target: ${{ matrix.bun-target }}
          formats: ${{ matrix.formats }}
          arch-package: ${{ matrix.arch-package }}

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: switchyard-${{ matrix.target }}
          path: ${{ steps.package.outputs.dir }}/*
          retention-days: 7
          if-no-files-found: error

name: Package desktop app
description: Build the gateway and accounts CLI as standalone binaries and package the desktop app as an installer.

inputs:
  target:
    description: Asset target name, e.g. linux-x64
    required: true
  triple:
    description: Rust target triple of the runner
    required: true
  bun-target:
    description: Bun compile target, e.g. bun-linux-x64
    required: true
  formats:
    description: Comma-separated cargo-packager formats (deb, appimage, pacman, dmg, nsis)
    required: true
  arch-package:
    description: Also build an Arch Linux package from the pacman tarball with makepkg
    required: false
    default: 'false'
  version:
    description: Release version without the leading v; empty keeps the crate version
    required: false
    default: ''

outputs:
  dir:
    description: Directory with the renamed installers
    value: dist

runs:
  using: composite
  steps:
    - name: Install Linux GPUI dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config cmake libclang-dev \
          libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
          libx11-xcb-dev libxcb1-dev libvulkan-dev \
          libfontconfig-dev libfreetype-dev libasound2-dev

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: desktop

    - name: Build gateway and accounts binaries
      shell: bash
      env:
        TRIPLE: ${{ inputs.triple }}
        BUN_TARGET: ${{ inputs.bun-target }}
      run: |
        bun run scripts/compile-sidecars.ts --target "$BUN_TARGET" --triple "$TRIPLE" --outdir desktop/target/sidecars
        ls -la desktop/target/sidecars

    - name: Check the sidecars run without node_modules
      if: runner.os != 'Windows'
      shell: bash
      env:
        TRIPLE: ${{ inputs.triple }}
      run: |
        mv node_modules "$RUNNER_TEMP/node_modules"
        trap 'mv "$RUNNER_TEMP/node_modules" node_modules' EXIT
        work="$RUNNER_TEMP/sidecar-check"
        mkdir -p "$work"
        SESSION_DIR="$work/session" DATA_DIR="$work" "desktop/target/sidecars/freeapi-accounts-$TRIPLE" --json > /dev/null
        UNIFIED_PORT=3290 SESSION_DIR="$work/session" DATA_DIR="$work" MODEL_REFRESH_MINUTES=0 \
          "desktop/target/sidecars/freeapi-gateway-$TRIPLE" > "$work/gateway.log" 2>&1 &
        pid=$!
        for attempt in $(seq 1 90); do
          if curl -sf http://127.0.0.1:3290/health > /dev/null; then kill "$pid"; exit 0; fi
          if ! kill -0 "$pid" 2>/dev/null; then cat "$work/gateway.log"; exit 1; fi
          sleep 1
        done
        cat "$work/gateway.log"
        kill "$pid"
        exit 1

    - name: Install cargo-packager
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-packager@0.11.8

    - name: Build desktop app
      shell: bash
      run: cargo build --manifest-path desktop/Cargo.toml --release --locked

    - name: Set package version
      if: inputs.version != ''
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: perl -pi -e 's/^version = ".*"/version = "$ENV{VERSION}"/ if $. < 6' desktop/Cargo.toml

    - name: Package
      shell: bash
      working-directory: desktop
      env:
        NO_STRIP: '1'
        APPIMAGE_EXTRACT_AND_RUN: '1'
      run: cargo packager --release --formats ${{ inputs.formats }}

    - name: Rename installers
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        FORMATS: ${{ inputs.formats }}
      run: |
        version=$(perl -ne 'print $1 if /^version = "(.*)"/ && $. < 6' desktop/Cargo.toml)
        mkdir -p dist
        for format in ${FORMATS//,/ }; do
          case "$format" in
            deb) pattern='*.deb'; suffix='.deb' ;;
            appimage) pattern='*.AppImage'; suffix='.AppImage' ;;
            pacman) pattern='*.tar.gz'; suffix='.tar.gz' ;;
            dmg) pattern='*.dmg'; suffix='.dmg' ;;
            nsis) pattern='*-setup.exe'; suffix='-setup.exe' ;;
            *) echo "Unknown format $format"; exit 1 ;;
          esac
          source=$(find desktop/target/packages -maxdepth 1 -name "$pattern" | head -1)
          if [ -z "$source" ]; then echo "No $format package produced"; ls -la desktop/target/packages; exit 1; fi
          cp "$source" "dist/switchyard-$version-$TARGET$suffix"
        done
        ls -la dist

    - name: Build Arch Linux package
      if: inputs.arch-package == 'true'
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        version=$(perl -ne 'print $1 if /^version = "(.*)"/ && $. < 6' desktop/Cargo.toml)
        mkdir -p arch
        cp "dist/switchyard-$version-$TARGET.tar.gz" arch/
        bun run scripts/pkgbuild.ts --version "$version" --x86_64 "arch/switchyard-$version-$TARGET.tar.gz" --out arch/PKGBUILD
        docker run --rm -v "$PWD/arch:/build" archlinux:base-devel bash -c \
          'useradd -m builder && chown -R builder /build && su builder -c "cd /build && makepkg --nodeps --noconfirm"'
        cp arch/*.pkg.tar.zst dist/
        ls -la dist

name: Package desktop app
description: Build the gateway and accounts CLI as standalone binaries and package the desktop app as an installer.

inputs:
  target:
    description: Asset target name, e.g. linux-x64
    required: true
  triple:
    description: Rust target triple of the runner
    required: true
  bun-target:
    description: Bun compile target, e.g. bun-linux-x64
    required: true
  format:
    description: cargo-packager format (deb, dmg, nsis)
    required: true
  version:
    description: Release version without the leading v; empty keeps the crate version
    required: false
    default: ''

outputs:
  asset:
    description: Path of the renamed installer
    value: ${{ steps.rename.outputs.asset }}

runs:
  using: composite
  steps:
    - name: Install Linux GPUI dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config cmake libclang-dev \
          libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
          libx11-xcb-dev libxcb1-dev libvulkan-dev \
          libfontconfig-dev libfreetype-dev libasound2-dev

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Build gateway and accounts binaries
      shell: bash
      env:
        TRIPLE: ${{ inputs.triple }}
        BUN_TARGET: ${{ inputs.bun-target }}
      run: |
        ext=""
        if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
        mkdir -p desktop/target/sidecars
        bun build --compile --target="$BUN_TARGET" src/unified/server.ts --external 'chromium-bidi/*' --outfile "desktop/target/sidecars/freeapi-gateway-$TRIPLE$ext"
        bun build --compile --target="$BUN_TARGET" scripts/accounts.ts --external 'chromium-bidi/*' --outfile "desktop/target/sidecars/freeapi-accounts-$TRIPLE$ext"
        ls -la desktop/target/sidecars

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: desktop

    - name: Install cargo-packager
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-packager@0.11.8

    - name: Build desktop app
      shell: bash
      run: cargo build --manifest-path desktop/Cargo.toml --release --locked

    - name: Set package version
      if: inputs.version != ''
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: perl -pi -e 's/^version = ".*"/version = "$ENV{VERSION}"/ if $. < 6' desktop/Cargo.toml

    - name: Package
      shell: bash
      working-directory: desktop
      run: cargo packager --release --formats ${{ inputs.format }}

    - name: Rename installer
      id: rename
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        FORMAT: ${{ inputs.format }}
      run: |
        version=$(perl -ne 'print $1 if /^version = "(.*)"/ && $. < 6' desktop/Cargo.toml)
        case "$FORMAT" in
          deb) pattern='*.deb'; suffix='.deb' ;;
          dmg) pattern='*.dmg'; suffix='.dmg' ;;
          nsis) pattern='*-setup.exe'; suffix='-setup.exe' ;;
          *) echo "Unknown format $FORMAT"; exit 1 ;;
        esac
        source=$(find desktop/target/packages -maxdepth 1 -name "$pattern" | head -1)
        if [ -z "$source" ]; then echo "No $FORMAT package produced"; ls -la desktop/target/packages; exit 1; fi
        asset="switchyard-$version-$TARGET$suffix"
        cp "$source" "$asset"
        echo "asset=$asset" >> "$GITHUB_OUTPUT"

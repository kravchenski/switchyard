[package]
name = "freeapi-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui-kit = "=0.6.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4", features = ["json"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[package.metadata.packager]
product-name = "Switchyard"
identifier = "com.kravchenski.switchyard"
description = "Local OpenAI-compatible gateway for web AI chats and free model APIs"
homepage = "https://github.com/kravchenski/switchyard"
authors = ["kravchenski"]
publisher = "kravchenski"
category = "DeveloperTool"
license-file = "../LICENSE"
out-dir = "target/packages"
binaries-dir = "target/release"
binaries = [{ path = "freeapi-desktop", main = true }]
external-binaries = ["target/sidecars/freeapi-gateway", "target/sidecars/freeapi-accounts"]
icons = ["assets/icons/icon-32.png", "assets/icons/icon-128.png", "assets/icons/icon-256.png", "assets/icons/icon-512.png"]

[package.metadata.packager.deb]
package-name = "free-ai-gateway"
depends = [
  "libxkbcommon0",
  "libxkbcommon-x11-0",
  "libwayland-client0",
  "libvulkan1",
  "libfontconfig1",
  "libfreetype6",
  "libasound2t64 | libasound2",
]

[package.metadata.packager.pacman]
files = { "../LICENSE" = "usr/share/licenses/switchyard/LICENSE" }
